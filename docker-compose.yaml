version: "3.8"

# =============================================================
# LAKEHOUSE OMNICANAL — STACK COMPLÈTE
# MinIO + Hive Metastore + Spark + Trino + Airflow + Superset
# =============================================================

networks:
  lakehouse-net:
    driver: bridge

volumes:
  minio-data:
  postgres-metastore-data:
  postgres-airflow-data:
  superset-data:

services:

  # ─────────────────────────────────────────────
  # 1. MinIO — Stockage objet (couche S3)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Initialisation des buckets MinIO
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/lakehouse-bronze;
      mc mb --ignore-existing local/lakehouse-silver;
      mc mb --ignore-existing local/lakehouse-gold;
      mc mb --ignore-existing local/warehouse;
      echo 'Buckets créés avec succès';
      "
    networks:
      - lakehouse-net

  # ─────────────────────────────────────────────
  # 2. PostgreSQL — Hive Metastore backend
  # ─────────────────────────────────────────────
  postgres-metastore:
    image: postgres:14
    container_name: postgres-metastore
    hostname: postgres-metastore
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
    volumes:
      - postgres-metastore-data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 3. Hive Metastore — Catalogue Iceberg
  # ─────────────────────────────────────────────
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      postgres-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-metastore:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive123
    ports:
      - "9083:9083"
    volumes:
      - ./docker/hive/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./docker/hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────────
  # 4. Apache Spark — Master + Workers
  # ─────────────────────────────────────────────
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    ports:
      - "8080:8080"   # Spark UI
      - "7077:7077"   # Spark Master
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./docker/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
    networks:
      - lakehouse-net
    depends_on:
      - hive-metastore

  spark-worker-1:
    image: bitnami/spark:3.5.0
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./docker/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
    networks:
      - lakehouse-net
    depends_on:
      - spark-master

  spark-worker-2:
    image: bitnami/spark:3.5.0
    container_name: spark-worker-2
    hostname: spark-worker-2
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./docker/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
    networks:
      - lakehouse-net
    depends_on:
      - spark-master

  # ─────────────────────────────────────────────
  # 5. Trino — Moteur SQL analytique
  # ─────────────────────────────────────────────
  trino:
    image: trinodb/trino:435
    container_name: trino
    hostname: trino
    ports:
      - "8081:8080"   # Trino UI
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./docker/trino/config.properties:/etc/trino/config.properties
      - ./docker/trino/jvm.config:/etc/trino/jvm.config
    networks:
      - lakehouse-net
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────────
  # 6. Apache Superset — Visualisation BI
  # ─────────────────────────────────────────────
  superset-db:
    image: postgres:14
    container_name: superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset123
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - lakehouse-net

  superset:
    image: apache/superset:3.1.0
    container_name: superset
    hostname: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "supersecretkey_lakehouse_2024"
      DATABASE_URL: "postgresql+psycopg2://superset:superset123@superset-db:5432/superset"
    volumes:
      - superset-data:/app/superset_home
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py
    networks:
      - lakehouse-net
    depends_on:
      - superset-db
      - trino

  superset-init:
    image: apache/superset:3.1.0
    container_name: superset-init
    depends_on:
      - superset-db
    environment:
      SUPERSET_SECRET_KEY: "supersecretkey_lakehouse_2024"
      DATABASE_URL: "postgresql+psycopg2://superset:superset123@superset-db:5432/superset"
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@lakehouse.com --password admin123 &&
        superset init &&
        echo 'Superset initialisé'
      "
    networks:
      - lakehouse-net

  # ─────────────────────────────────────────────
  # 7. Jupyter Notebook — Développement Spark
  # ─────────────────────────────────────────────
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      SPARK_MASTER: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    volumes:
      - ./spark/jobs:/home/jovyan/work/jobs
      - ./spark/data_generator:/home/jovyan/work/data_generator
    networks:
      - lakehouse-net
    depends_on:
      - spark-master
# version: "3.8"
# =============================================================
# LAKEHOUSE OMNICANAL — STACK COMPLÈTE CORRIGÉE
# Fix: Hive S3AFileSystem ClassNotFoundException
# =============================================================

networks:
  lakehouse-net:
    driver: bridge

volumes:
  minio-data:
  postgres-metastore-data:
  postgres-airflow-data:
  superset-data:

services:

  # ─────────────────────────────────────────────
  # 1. MinIO — Stockage objet (couche S3)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Initialisation des buckets MinIO
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/lakehouse-bronze;
      mc mb --ignore-existing local/lakehouse-silver;
      mc mb --ignore-existing local/lakehouse-gold;
      mc mb --ignore-existing local/lakehouse-raw;
      mc mb --ignore-existing local/warehouse;
      echo 'Buckets créés OK';
      "
    networks:
      - lakehouse-net

  # ─────────────────────────────────────────────
  # 2. PostgreSQL — Backend Hive Metastore
  # ─────────────────────────────────────────────
  postgres-metastore:
    image: postgres:13
    container_name: postgres-metastore
    hostname: postgres-metastore
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
    volumes:
      - postgres-metastore-data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # 3. Hive Metastore — Image custom avec JARs S3A
  # FIX: build local pour inclure hadoop-aws + aws-sdk
  # ─────────────────────────────────────────────
  hive-metastore:
    build:
      context: ./docker/hive
      dockerfile: Dockerfile
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      postgres-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # Credentials S3A injectés aussi via env
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-metastore:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive123
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.access.key=minioadmin
        -Dfs.s3a.secret.key=minioadmin123
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        -Dfs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
        -Dfs.s3a.connection.ssl.enabled=false
    ports:
      - "9083:9083"
    volumes:
      - ./docker/hive/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./docker/hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ─────────────────────────────────────────────
  # 4. Apache Spark — Master
  # ─────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    user: root
    environment:
      SPARK_MODE: master
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    command: >
      /bin/bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./data:/opt/spark-data
      - ./minio-init:/opt/minio-init
    networks:
      - lakehouse-net
    depends_on:
      hive-metastore:
        condition: service_healthy

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    user: root
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    command: >
      /bin/bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081"
    ports:
      - "8082:8081"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./data:/opt/spark-data
    networks:
      - lakehouse-net
    depends_on:
      - spark-master

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    user: root
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    command: >
      /bin/bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081"
    ports:
      - "8083:8081"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./data:/opt/spark-data
    networks:
      - lakehouse-net
    depends_on:
      - spark-master

  # ─────────────────────────────────────────────
  # 5. Trino — Moteur SQL analytique
  # ─────────────────────────────────────────────
  trino:
    image: trinodb/trino:435
    container_name: trino
    hostname: trino
    ports:
      - "8081:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/config.properties:/etc/trino/config.properties
      - ./docker/trino/jvm.config:/etc/trino/jvm.config
    networks:
      - lakehouse-net
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────────
  # 6. PostgreSQL — Backend Superset
  # ─────────────────────────────────────────────
  superset-db:
    image: postgres:13
    container_name: superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset123
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Init Superset (à lancer une seule fois)
  superset-init:
    image: apache/superset:3.1.0
    container_name: superset-init
    depends_on:
      superset-db:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "supersecretkey_lakehouse_2024"
      DATABASE_URL: "postgresql+psycopg2://superset:superset123@superset-db:5432/superset"
    command: >
      bash -c "
        pip install trino sqlalchemy-trino --quiet &&
        superset db upgrade &&
        superset fab create-admin
          --username admin
          --firstname Admin
          --lastname User
          --email admin@lakehouse.com
          --password admin123 &&
        superset init &&
        echo 'Superset initialisé avec succès'
      "
    networks:
      - lakehouse-net

  # Apache Superset
  superset:
    image: apache/superset:3.1.0
    container_name: superset
    hostname: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "supersecretkey_lakehouse_2024"
      DATABASE_URL: "postgresql+psycopg2://superset:superset123@superset-db:5432/superset"
    volumes:
      - superset-data:/app/superset_home
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py
    networks:
      - lakehouse-net
    depends_on:
      superset-db:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # 7. Jupyter — Dev & exploration Spark
  # ─────────────────────────────────────────────
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    volumes:
      - ./spark/jobs:/home/jovyan/work/jobs
      - ./data:/home/jovyan/work/data
    networks:
      - lakehouse-net
    depends_on:
      - spark-master
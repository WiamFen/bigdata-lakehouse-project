# =====================================================
# Spark Defaults — Lakehouse Omnicanal
# Adapté à votre structure de données réelle
# =====================================================

# --- Packages : Iceberg + AWS S3A ---
spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.4.3,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262

# --- Extensions Iceberg ---
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# --- Catalogue Iceberg via Hive Metastore ---
spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type=hive
spark.sql.catalog.lakehouse.uri=thrift://hive-metastore:9083
spark.sql.catalog.lakehouse.warehouse=s3a://warehouse/
spark.sql.defaultCatalog=lakehouse

# --- MinIO / S3A ---
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=minioadmin123
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.fast.upload=true

# --- Performances ---
spark.sql.shuffle.partitions=10
spark.executor.memory=1g
spark.driver.memory=1g
spark.sql.adaptive.enabled=true